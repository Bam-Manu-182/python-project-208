{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Eliminar tarea</h1>
    <p>¿Estás seguro de que deseas eliminar la tarea "{{ task.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
