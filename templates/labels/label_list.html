{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Etiquetas</h1>
    <a href="{% url 'label_create' %}" class="btn btn-primary mb-3">Crear etiqueta</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha de creación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for label in labels %}
            <tr>
                <td>{{ label.id }}</td>
                <td>{{ label.name }}</td>
                <td>{{ label.created_at|date:"d.m.Y H:i" }}</td>
                <td>
                    <a href="{% url 'label_update' label.id %}">Editar</a>
                    <a href="{% url 'label_delete' label.id %}">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay etiquetas creadas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
