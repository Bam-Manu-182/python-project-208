{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<h1 class="my-4">Eliminar usuario</h1>

<p>¿Estás seguro de que quieres eliminar el usuario {{ object.username }}?</p>

<form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Sí, eliminar" %}
</form>
{% endblock %}
