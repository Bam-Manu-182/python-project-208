[project]
name = "hexlet-code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
    "psycopg>=3.3.4",
    "psycopg2>=2.9.12",
    "django-bootstrap5>=26.2",
    "django-filter>=26.1",
    "rollbar>=1.4.0",
]

[tool.uv]
dev-dependencies = ["coverage>=7.0"]

[tool.coverage.run]
source = ["task_manager", "users", "statuses", "tasks", "labels"]
omit = ["*/tests/*", "*/migrations/*", "manage.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
